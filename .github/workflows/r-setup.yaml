name: R setup

on:
  push:
    paths:
      - additional_material/r_setup/**
      - additional_material/colab_nb/*.ipynb
      - .github/scripts/check-r-setup.R
      - .github/scripts/check-r-colab.R
      - .github/workflows/r-setup.yaml
  pull_request:
    paths:
      - additional_material/r_setup/**
      - additional_material/colab_nb/*.ipynb
      - .github/scripts/check-r-setup.R
      - .github/scripts/check-r-colab.R
      - .github/workflows/r-setup.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.13"
          - os: macos-15
            python: "3.13"
          # TensorFlow's Intel Mac wheels require an older Python.
          - os: macos-15-intel
            python: "3.11"
    env:
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install and check Keras and TensorFlow
        shell: Rscript {0}
        run: |
          options(reticulate.virtualenv.starter = Sys.getenv("pythonLocation"))
          source(".github/scripts/check-r-setup.R")

  colab:
    name: Colab notebook / managed Python on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: false

      - name: Install Linux build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Run the Colab notebook setup and training check
        shell: Rscript {0}
        run: source(".github/scripts/check-r-colab.R")
