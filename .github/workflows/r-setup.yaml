name: R setup

on:
  push:
    paths:
      - additional_material/r_setup/**
      - additional_material/colab_nb/RandTensorFlow.ipynb
      - .github/scripts/check-r-setup.R
      - .github/workflows/r-setup.yaml
  pull_request:
    paths:
      - additional_material/r_setup/**
      - additional_material/colab_nb/RandTensorFlow.ipynb
      - .github/scripts/check-r-setup.R
      - .github/workflows/r-setup.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    env:
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: false

      - name: Install Linux build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install and check Keras and TensorFlow
        shell: Rscript {0}
        run: source(".github/scripts/check-r-setup.R")
